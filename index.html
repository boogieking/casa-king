<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Casa King">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<title>Casa King</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Dark Command palette */
  --bg:#0d0d1a;
  --navy:#1a1a2e;
  --navy2:#16213e;
  --navy3:#0f3460;
  --surface:#1e1e35;
  --surface2:#252540;
  --surface3:#2e2e50;
  --ink:#e8e8f0;
  --ink2:#9090b8;
  --ink3:#5a5a80;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.04);

  /* Category dot colors */
  --dot-shopping:#f97316;
  --dot-house:#3b82f6;
  --dot-check:#eab308;
  --dot-do:#22c55e;
  --dot-remember:#a855f7;

  /* Accents */
  --accent:#e94560;
  --accent-glow:rgba(233,69,96,0.25);
  --cyan:#00d4ff;
  --cyan-soft:rgba(0,212,255,0.12);

  --radius:10px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --nav-h:60px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);
  font-family:'Space Grotesk',sans-serif;
  color:var(--ink);
  display:flex;flex-direction:column;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(233,69,96,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 120%, rgba(0,212,255,0.05) 0%, transparent 60%);
}

/* ── HEADER ── */
.header{
  background:linear-gradient(180deg, rgba(30,30,53,0.98) 0%, rgba(26,26,46,0.95) 100%);
  border-bottom:1px solid var(--border);
  padding:14px 16px 12px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  flex-shrink:0;
  position:relative;
  overflow:hidden;
}
.header::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg, var(--accent) 0%, var(--cyan) 50%, var(--dot-remember) 100%);
}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.title{
  font-size:20px;font-weight:700;letter-spacing:-0.02em;
  background:linear-gradient(135deg, #fff 0%, var(--ink2) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.title-accent{
  background:linear-gradient(135deg, var(--accent) 0%, #ff8c42 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  font-style:normal;
}
.date-lbl{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--ink3);letter-spacing:0.08em;
  background:var(--surface2);border:1px solid var(--border);
  padding:4px 10px;border-radius:20px;
}
.stats-row{display:flex;gap:6px;flex-wrap:wrap;}
.stat-chip{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:4px 10px;
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink2);
  display:flex;align-items:center;gap:5px;
}
.stat-chip b{color:var(--ink);font-weight:600;}
.stat-dot{width:6px;height:6px;border-radius:50%;}

/* ── SCROLL AREA ── */
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(var(--nav-h) + var(--safe-bottom) + 20px);}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(13,13,26,0.97);
  border-top:1px solid var(--border);
  backdrop-filter:blur(12px);
  display:flex;height:calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);z-index:200;
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:6px 4px;transition:all 0.2s;position:relative;}
.nav-item:active{opacity:0.7;}
.nav-icon{font-size:19px;line-height:1;transition:transform 0.2s;}
.nav-label{font-size:9px;color:var(--ink3);letter-spacing:0.07em;text-transform:uppercase;font-weight:500;}
.nav-item.active .nav-label{color:var(--accent);}
.nav-item.active .nav-icon{transform:scale(1.15);}
.nav-item.active::before{
  content:'';position:absolute;top:0;left:25%;right:25%;height:2px;
  background:var(--accent);border-radius:0 0 2px 2px;
  box-shadow:0 0 8px var(--accent-glow);
}

/* ── ADD BAR ── */
.add-bar{
  display:flex;flex-direction:column;gap:8px;margin-bottom:14px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px;
}
.add-row1{display:flex;gap:8px;}
.add-input{
  flex:1;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:11px 14px;
  font-family:'Space Grotesk',sans-serif;font-size:14px;color:var(--ink);
  outline:none;-webkit-appearance:none;
  transition:border-color 0.2s;
}
.add-input::placeholder{color:var(--ink3);}
.add-input:focus{border-color:var(--accent);}
.add-btn{
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:11px 18px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;
  cursor:pointer;white-space:nowrap;
  box-shadow:0 0 16px var(--accent-glow);
  transition:all 0.15s;
}
.add-btn:active{transform:scale(0.97);opacity:0.9;}
.cat-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.cat-row::-webkit-scrollbar{display:none;}
.cat-pill{
  padding:6px 12px;border-radius:20px;font-size:11px;font-weight:500;
  border:1px solid var(--border);background:var(--surface2);color:var(--ink2);
  cursor:pointer;white-space:nowrap;transition:all 0.15s;min-height:34px;
  display:flex;align-items:center;gap:6px;
}
.cat-pill .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.cat-pill.active{background:var(--surface3);border-color:rgba(255,255,255,0.2);color:var(--ink);}

/* ── SECTION ── */
.section{margin-bottom:12px;}
.sec-head{
  display:flex;align-items:center;gap:8px;padding:9px 6px;
  cursor:pointer;user-select:none;min-height:44px;
}
.sec-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor;}
.sec-title{font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:0.09em;text-transform:uppercase;flex:1;}
.sec-badge{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  background:var(--surface2);border:1px solid var(--border);
  padding:2px 8px;border-radius:20px;color:var(--ink3);
  min-width:28px;text-align:center;
}
.sec-arrow{font-size:9px;color:var(--ink3);transition:transform 0.2s;width:16px;text-align:center;}
.sec-arrow.open{transform:rotate(90deg);}
.sec-body{display:flex;flex-direction:column;gap:2px;}
.sec-body.collapsed{display:none;}

/* ── ITEMS ── */
.item{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;background:var(--surface);
  border-radius:8px;border:1px solid var(--border2);
  min-height:48px;transition:all 0.15s;
}
.item:active{background:var(--surface2);}
.item.done .item-text{text-decoration:line-through;color:var(--ink3);}
.item.done{background:transparent;border-color:transparent;opacity:0.55;}
.cb{
  width:22px;height:22px;border-radius:6px;
  border:1.5px solid var(--ink3);background:transparent;
  cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;
}
.cb.on{background:var(--dot-do);border-color:var(--dot-do);box-shadow:0 0 10px rgba(34,197,94,0.35);}
.cb.on::after{
  content:'';width:10px;height:6px;
  border-left:2px solid white;border-bottom:2px solid white;
  transform:rotate(-45deg) translateY(-1px);display:block;
}
.item-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.item-text{flex:1;font-size:13px;color:var(--ink);line-height:1.4;font-weight:400;}
.item-del{
  width:30px;height:30px;border-radius:6px;border:none;
  background:transparent;color:var(--ink3);cursor:pointer;
  font-size:14px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all 0.15s;
}
.item-del:active{background:rgba(233,69,96,0.15);color:var(--accent);}

/* ── DONE ── */
.done-toggle{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--ink3);cursor:pointer;letter-spacing:0.04em;
  display:flex;align-items:center;gap:6px;padding:10px 6px;min-height:44px;user-select:none;
}
.done-items.collapsed{display:none;}
.done-items{display:flex;flex-direction:column;gap:2px;}
.item-readd{
  margin-left:auto;background:none;border:1px solid var(--acc);
  color:var(--acc);border-radius:6px;padding:2px 8px;font-size:13px;cursor:pointer;
}
  margin-left:auto;background:var(--surface3);color:var(--ink3);
  border:1px solid var(--border);border-radius:6px;padding:3px 10px;
  font-family:'JetBrains Mono',monospace;font-size:9px;cursor:pointer;
  letter-spacing:0.06em;text-transform:uppercase;
}

/* ── CLEANING ── */
.clean-freq-tabs{display:flex;gap:6px;margin-bottom:12px;}
.freq-tab{
  flex:1;padding:9px 8px;border-radius:8px;font-size:11px;font-weight:600;
  border:1px solid var(--border);background:var(--surface2);color:var(--ink3);
  cursor:pointer;text-align:center;letter-spacing:0.06em;text-transform:uppercase;
  transition:all 0.15s;
}
.freq-tab.active-daily{background:rgba(249,115,22,0.12);border-color:var(--dot-shopping);color:var(--dot-shopping);}
.freq-tab.active-weekly{background:rgba(59,130,246,0.12);border-color:var(--dot-house);color:var(--dot-house);}
.freq-tab.active-monthly{background:rgba(168,85,247,0.12);border-color:var(--dot-remember);color:var(--dot-remember);}

.clean-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.clean-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.clean-freq-lbl{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;}
.freq-daily{color:var(--dot-shopping);}
.freq-weekly{color:var(--dot-house);}
.freq-monthly{color:var(--dot-remember);}
.clean-badge{
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;
  background:var(--surface2);border:1px solid var(--border);
  padding:3px 10px;border-radius:20px;
}
.clean-progress{height:3px;background:var(--surface3);border-radius:2px;margin-bottom:14px;overflow:hidden;}
.clean-bar{height:100%;border-radius:2px;transition:width 0.4s ease;}
.pb-daily{background:linear-gradient(90deg, var(--dot-shopping), #fb923c);}
.pb-weekly{background:linear-gradient(90deg, var(--dot-house), #60a5fa);}
.pb-monthly{background:linear-gradient(90deg, var(--dot-remember), #c084fc);}
.clean-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--border2);min-height:44px;
}
.clean-item:last-child{border-bottom:none;}
.clean-item-text{flex:1;font-size:13px;color:var(--ink);font-weight:400;}
.clean-item.done .clean-item-text{text-decoration:line-through;color:var(--ink3);}
.reset-btn{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:11px;font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--ink3);cursor:pointer;margin-top:12px;min-height:44px;
  letter-spacing:0.06em;text-transform:uppercase;transition:all 0.15s;
}
.reset-btn:active{border-color:var(--accent);color:var(--accent);}

/* ── PHRASES ── */
.phrase-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;margin-bottom:10px;
}
.phrase-label{font-size:9px;color:var(--ink3);letter-spacing:0.1em;text-transform:uppercase;font-weight:600;margin-bottom:8px;}
.phrase-text{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:10px;}
.phrase-input{
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink);
  width:100%;outline:none;margin-bottom:8px;-webkit-appearance:none;
}
.phrase-input:focus{border-color:var(--cyan);}
.copy-btn{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:11px;font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--ink2);cursor:pointer;min-height:44px;transition:all 0.15s;
  letter-spacing:0.06em;text-transform:uppercase;
}
.copy-btn:active{border-color:var(--cyan);color:var(--cyan);}
.copy-btn.copied{border-color:var(--dot-do);color:var(--dot-do);}

/* ── AI CHAT ── */
.chat-wrap{display:flex;flex-direction:column;height:100%;}
.suggestion-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;flex-shrink:0;}
.chip{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:7px 12px;font-size:11px;font-weight:500;
  color:var(--ink2);cursor:pointer;white-space:nowrap;min-height:36px;
  display:flex;align-items:center;transition:all 0.15s;
}
.chip:active{border-color:var(--cyan);color:var(--cyan);}
.chat-messages{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:10px;padding-bottom:8px;
}
.msg{max-width:88%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;}
.msg.user{
  background:rgba(233,69,96,0.12);border:1px solid rgba(233,69,96,0.2);
  align-self:flex-end;border-bottom-right-radius:3px;
}
.msg.ai{
  background:var(--surface);border:1px solid var(--border);
  align-self:flex-start;border-bottom-left-radius:3px;
}
.msg-name{font-size:9px;color:var(--cyan);letter-spacing:0.1em;text-transform:uppercase;font-weight:600;margin-bottom:4px;}
.thinking-dots{display:inline-flex;gap:4px;align-items:center;}
.thinking-dots span{width:5px;height:5px;background:var(--ink2);border-radius:50%;animation:dot 1.2s infinite;}
.thinking-dots span:nth-child(2){animation-delay:0.2s;}
.thinking-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes dot{0%,80%,100%{opacity:0.2}40%{opacity:1}}
.chat-input-row{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border);flex-shrink:0;}
.chat-input{
  flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;font-family:'Space Grotesk',sans-serif;font-size:14px;color:var(--ink);
  outline:none;resize:none;min-height:48px;max-height:100px;-webkit-appearance:none;
  transition:border-color 0.2s;
}
.chat-input::placeholder{color:var(--ink3);}
.chat-input:focus{border-color:var(--cyan);}
.chat-send{
  background:var(--cyan);color:var(--bg);border:none;border-radius:10px;
  padding:12px 16px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;align-self:flex-end;min-width:60px;min-height:48px;
  box-shadow:0 0 16px rgba(0,212,255,0.3);transition:all 0.15s;
}
.chat-send:disabled{opacity:0.4;box-shadow:none;}
.chat-send:active{transform:scale(0.97);}

.empty{text-align:center;padding:40px 20px;color:var(--ink3);font-size:12px;font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div class="title">Casa King — <span class="title-accent">SMA</span></div>
    <div class="date-lbl" id="date-disp"></div>
  </div>
  <div class="stats-row" id="stats-row"></div>
</div>

<div class="scroll-area" id="scroll-area">
  <div id="main"></div>
</div>

<nav class="bottom-nav">
  <div class="nav-item active" id="nav-lists" onclick="setTab('lists','nav-lists')">
    <div class="nav-icon">📋</div>
    <div class="nav-label">Lists</div>
  </div>
  <div class="nav-item" id="nav-cleaning" onclick="setTab('cleaning','nav-cleaning')">
    <div class="nav-icon">🧹</div>
    <div class="nav-label">Cleaning</div>
  </div>
  <div class="nav-item" id="nav-ai" onclick="setTab('ai','nav-ai')">
    <div class="nav-icon">✨</div>
    <div class="nav-label">Assistant</div>
  </div>
  <div class="nav-item" id="nav-phrases" onclick="setTab('phrases','nav-phrases')">
    <div class="nav-icon">🇲🇽</div>
    <div class="nav-label">Español</div>
  </div>
  <div class="nav-item" onclick="window.open('https://boogieking.github.io/cam-secure','_blank')">
    <div class="nav-icon">📷</div>
    <div class="nav-label">Cams</div>
  </div>
</nav>

<script>
const CATS={
  shopping:{label:'Shopping',icon:'🛒',dot:'var(--dot-shopping)'},
  house:{label:'House',icon:'🏠',dot:'var(--dot-house)'},
  check:{label:'Check',icon:'📋',dot:'var(--dot-check)'},
  do:{label:'To Do',icon:'✅',dot:'var(--dot-do)'},
  remember:{label:'Remember',icon:'💡',dot:'var(--dot-remember)'},
};
const PHRASES=[
  {label:'Taxi to La Comer',tmpl:'Soy Cameron King. ¿Puedo ir a LA Comer, por favor?',slots:[]},
  {label:'Taxi pickup request',tmpl:'Hola, soy Cameron King. ¿Podrías recogerme en LA Comer a las {TIME}, por favor?',slots:[{k:'TIME',ph:'3:00 PM'}]},
  {label:'Ask where to find something',tmpl:'¿Dónde puedo encontrar {ITEM}?',slots:[{k:'ITEM',ph:'aceite de oliva'}]},
  {label:'Price check',tmpl:'¿Cuánto cuesta {ITEM}?',slots:[{k:'ITEM',ph:'esto'}]},
  {label:'Garrafón delivery',tmpl:'Necesito {COUNT} garrafón de agua, por favor. Soy Cameron King.',slots:[{k:'COUNT',ph:'un'}]},
  {label:'Pharmacy request',tmpl:'Necesito {MEDICINE}, por favor.',slots:[{k:'MEDICINE',ph:'ibuprofeno'}]},
];
const CLEAN_TASKS={
  daily:['Wipe kitchen counters','Sweep main floors','Wash dishes / run dishwasher','Take out kitchen bin if full','Ella water & food bowls clean','Quick bathroom wipe-down'],
  weekly:['Mop all floors','Clean toilets & sinks','Scrub shower/bath','Change bed sheets','Vacuum rugs','Wipe stovetop & oven front','Clean mirrors','Wipe door handles & light switches','Empty all bins',"Sienna's room check"],
  monthly:['Deep clean oven','Descale kettle & coffee gear','Wipe inside fridge','Clean windows','Dust ceiling fans & lights','Wipe baseboards','Clean behind appliances','Check & replace any filters','Wash shower curtain','Garden / balcony sweep','Check supplies: cleaning products']
};


/* ── SUPABASE ── */
const SB_URL='https://irpfhfdzlpmgvtndbodo.supabase.co';
const SB_KEY='sb_publishable_J2GeLhSczAmtyXBaTuKuFQ_lyZvsRQL';
function sbFetch(path,opts={}){
  const headers={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
  if(opts.prefer)headers['Prefer']=opts.prefer;
  return fetch(SB_URL+'/rest/v1/'+path,{...opts,headers});
}

let items=[];
let cleanState={};
let chatHistory=[];
let currentTab='lists';
let selectedCat='shopping';
let activeFreq='daily';

async function loadData(){
  try{
    const [iRes,cRes]=await Promise.all([
      sbFetch('ck_items?select=*&order=created_at.asc'),
      sbFetch('ck_clean?select=*')
    ]);
    const iData=await iRes.json();
    const cData=await cRes.json();
    items=Array.isArray(iData)?iData:[];
    cleanState={};
    if(Array.isArray(cData))cData.forEach(r=>{cleanState[r.freq+'::'+r.task]=r.done;});
    if(!items.length)await seedItems();
  }catch(e){console.error('Load error',e);}
  render();updateStats();
}

async function seedItems(){
  const seed=[
    {cat:'shopping',text:'Potatoes',done:false},{cat:'shopping',text:'Tomatoes',done:false},
    {cat:'shopping',text:'Lettuce',done:false},{cat:'shopping',text:'Bread',done:false},
    {cat:'shopping',text:'Hamburger rolls',done:false},{cat:'shopping',text:'Garrafón of water',done:false},
    {cat:'shopping',text:'Water pump',done:false},{cat:'shopping',text:'Tea',done:false},
    {cat:'shopping',text:'Coke',done:false},{cat:'shopping',text:'Cordial',done:false},
    {cat:'shopping',text:'Milk',done:false},{cat:'shopping',text:'Fly swatter',done:false},
    {cat:'shopping',text:'Spray cleaner',done:false},{cat:'shopping',text:'Toilet Duck',done:false},

/* ── ITEM CRUD ── */
async function addItem(){
  const inp=document.getElementById('ni');
  const text=inp.value.trim();if(!text)return;
  const isDup=items.some(i=>i.cat===selectedCat&&i.text.trim().toLowerCase()===text.toLowerCase()&&!i.done);
  if(isDup){inp.select();inp.style.outline='2px solid #f87171';setTimeout(()=>inp.style.outline='',1200);return;}
  inp.value='';
  const res=await sbFetch('ck_items',{method:'POST',prefer:'return=representation',body:JSON.stringify({cat:selectedCat,text,done:false})});
  const data=await res.json();
  const newItem=Array.isArray(data)?data[0]:data;
  if(newItem&&newItem.id)items.unshift(newItem);
  render();
}
function selectCat(cat){
  selectedCat=cat;
  document.querySelectorAll('.cat-pill').forEach(p=>p.classList.toggle('active',p.dataset.cat===cat));
}
async function toggle(id){
  const it=items.find(i=>i.id===id);if(!it)return;
  it.done=!it.done;
  await sbFetch('ck_items?id=eq.'+id,{method:'PATCH',body:JSON.stringify({done:it.done})});
  render();
}
async function del(id){
  items=items.filter(i=>i.id!==id);
  await sbFetch('ck_items?id=eq.'+id,{method:'DELETE'});
  render();
}
async function clearDone(){
  // Archive: just leave done:true items in DB, hide from view by filtering locally
  render();
}
async function readd(id){
  const it=items.find(i=>i.id===id);if(!it)return;
  it.done=false;
  await sbFetch('ck_items?id=eq.'+id,{method:'PATCH',body:JSON.stringify({done:false})});
  render();
}

/* ── CLEAN CRUD ── */
async function toggleClean(freq,task){
  const k=freq+'::'+task;
  cleanState[k]=!cleanState[k];
  const encTask=encodeURIComponent(task);
  const chkRes=await sbFetch('ck_clean?freq=eq.'+freq+'&task=eq.'+encTask+'&select=id');
  const existing=await chkRes.json();
  if(existing&&existing.length){
    await sbFetch('ck_clean?id=eq.'+existing[0].id,{method:'PATCH',body:JSON.stringify({done:cleanState[k]})});
  }else{
    await sbFetch('ck_clean',{method:'POST',body:JSON.stringify({freq,task,done:cleanState[k]})});
  }
  renderCleaning();
}
async function resetFreq(freq){
  const tasks=CLEAN_TASKS[freq];
  await sbFetch('ck_clean?freq=eq.'+freq,{method:'DELETE'});
  if(tasks.length){
    await sbFetch('ck_clean',{method:'POST',body:JSON.stringify(tasks.map(t=>({freq,task:t,done:false,last_reset:new Date().toISOString()})))});
  }
  tasks.forEach(t=>{cleanState[freq+'::'+t]=false;});
  renderCleaning();
}

/* ── STATS & DATE ── */
function updateStats(){
  const active=items.filter(i=>!i.done).length;
  const done=items.filter(i=>i.done).length;
  const ct=Object.values(CLEAN_TASKS).flat().length;
  const cd=Object.values(cleanState).filter(v=>v).length;
  document.getElementById('stats-row').innerHTML=
    `<div class="stat-chip"><div class="stat-dot" style="background:var(--accent)"></div><b>${active}</b> open</div>`+
    `<div class="stat-chip"><div class="stat-dot" style="background:var(--dot-do)"></div><b>${done}</b> done</div>`+
    `<div class="stat-chip"><div class="stat-dot" style="background:var(--cyan)"></div><b>${cd}/${ct}</b> chores</div>`;
}
const now=new Date();
document.getElementById('date-disp').textContent=now.toLocaleDateString('en-MX',{weekday:'short',day:'numeric',month:'short'});

/* ── TABS ── */
function setTab(tab,navId){
  currentTab=tab;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById(navId).classList.add('active');
  render();
  document.getElementById('scroll-area').scrollTop=0;
}

/* ── ITEM HTML ── */
function itemHTML(it){
  const c=CATS[it.cat];
  return`<div class="item${it.done?' done':''}">
    <div class="cb${it.done?' on':''}" onclick="toggle(${it.id})"></div>
    <div class="item-dot" style="background:${c.dot}"></div>
    <span class="item-text">${esc(it.text)}</span>
    ${it.done
      ? `<button class="item-readd" onclick="readd(${it.id})">↩</button><button class="item-del" onclick="del(${it.id})">✕</button>`
      : `<button class="item-del" onclick="del(${it.id})">✕</button>`}
  </div>`;
}
function sectionHTML(cat){
  const c=CATS[cat];
  const all=items.filter(i=>i.cat===cat);if(!all.length)return'';
  const active=all.filter(i=>!i.done);
  const done=all.filter(i=>i.done);
  const id='s'+cat;
  return`<div class="section">
    <div class="sec-head" onclick="toggleSec('${id}')">
      <div class="sec-dot" style="background:${c.dot};color:${c.dot}"></div>
      <span class="sec-title">${c.label}</span>
      <span class="sec-badge">${active.length}</span>
      <span class="sec-arrow open" id="a${id}">▶</span>
    </div>
    <div class="sec-body" id="${id}">
      ${active.map(itemHTML).join('')}
      ${done.length?`<div class="done-toggle" onclick="toggleDone('d${id}')">
        <span>▶</span> ${done.length} completed
        <button class="clr-btn" onclick="event.stopPropagation();clearDone()">hide</button>
      </div><div class="done-items collapsed" id="d${id}">${done.map(itemHTML).join('')}</div>`:''}
    </div>
  </div>`;
}
function toggleSec(id){
  document.getElementById(id).classList.toggle('collapsed');
  const a=document.getElementById('a'+id);a.classList.toggle('open');
}
function toggleDone(id){document.getElementById(id).classList.toggle('collapsed');}
function listsHTML(){
  const catPills=Object.entries(CATS).map(([k,v])=>
    `<div class="cat-pill${k===selectedCat?' active':''}" data-cat="${k}" onclick="selectCat('${k}')">
      <div class="dot" style="background:${v.dot}"></div>${v.icon} ${v.label}
    </div>`
  ).join('');
  return`<div class="add-bar">
    <div class="add-row1">
      <input class="add-input" id="ni" placeholder="Add item..." autocomplete="off" onkeydown="if(event.key==='Enter')addItem()">
      <button class="add-btn" onclick="addItem()">Add</button>
    </div>
    <div class="cat-row">${catPills}</div>
  </div>
  ${Object.keys(CATS).map(sectionHTML).join('')||'<div class="empty">All clear 🎉</div>'}`;
}

/* ── CLEANING HTML ── */
function cleaningHTML(){
  const tasks=CLEAN_TASKS[activeFreq];
  const done=tasks.filter(t=>cleanState[activeFreq+'::'+t]).length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  const cls={daily:'freq-daily',weekly:'freq-weekly',monthly:'freq-monthly'}[activeFreq];
  const pbcls={daily:'pb-daily',weekly:'pb-weekly',monthly:'pb-monthly'}[activeFreq];
  const freqTabs=['daily','weekly','monthly'].map(f=>
    `<div class="freq-tab${f===activeFreq?' active-'+f:''}" onclick="setFreq('${f}')">${f.charAt(0).toUpperCase()+f.slice(1)}</div>`
  ).join('');
  return`<div class="clean-freq-tabs">${freqTabs}</div>
  <div class="clean-card">
    <div class="clean-head">
      <span class="clean-freq-lbl ${cls}">${activeFreq}</span>
      <span class="clean-badge">${done}/${tasks.length}</span>
    </div>
    <div class="clean-progress"><div class="clean-bar ${pbcls}" style="width:${pct}%"></div></div>
    ${tasks.map(t=>{
      const on=cleanState[activeFreq+'::'+t];
      return`<div class="clean-item${on?' done':''}">
        <div class="cb${on?' on':''}" onclick="toggleClean('${activeFreq}','${t.replace(/'/g,"\\'")}')"></div>
        <span class="clean-item-text">${esc(t)}</span>
      </div>`;
    }).join('')}
    <button class="reset-btn" onclick="resetFreq('${activeFreq}')">↺ Reset ${activeFreq}</button>
  </div>`;
}
function setFreq(f){activeFreq=f;renderCleaning();}
function renderCleaning(){if(currentTab==='cleaning')document.getElementById('main').innerHTML=cleaningHTML();updateStats();}

/* ── PHRASES ── */
function copyPhrase(idx,btn){
  const p=PHRASES[idx];let t=p.tmpl;
  p.slots.forEach(s=>{
    const el=document.getElementById(`pi${idx}${s.k}`);
    t=t.replace('{'+s.k+'}',el?el.value||s.ph:s.ph);
  });
  navigator.clipboard.writeText(t).then(()=>{
    btn.textContent='Copied!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy to clipboard';btn.classList.remove('copied');},2000);
  });
}
function phrasesHTML(){
  return PHRASES.map((p,i)=>{
    const slotInputs=p.slots.map(s=>`<input class="phrase-input" id="pi${i}${s.k}" placeholder="${s.ph}">`).join('');
    return`<div class="phrase-card">
      <div class="phrase-label">${p.label}</div>
      <div class="phrase-text">${esc(p.tmpl.replace(/{[^}]+}/g,'___'))}</div>
      ${slotInputs}
      <button class="copy-btn" onclick="copyPhrase(${i},this)">Copy to clipboard</button>
    </div>`;
  }).join('');
}

/* ── AI CHAT ── */
function getListSummary(){
  const active=items.filter(i=>!i.done);
  const byCat={};
  active.forEach(i=>{if(!byCat[i.cat])byCat[i.cat]=[];byCat[i.cat].push(i.text);});
  let s='Open tasks:\n';
  Object.entries(byCat).forEach(([c,txts])=>{s+=`${CATS[c].label}: ${txts.join(', ')}\n`;});
  const ct=Object.values(CLEAN_TASKS).flat().length;
  const cd=Object.values(cleanState).filter(v=>v).length;
  s+=`Cleaning: ${cd}/${ct} done.`;
  return s;
}
async function sendChat(){
  const inp=document.getElementById('chat-inp');
  const msg=inp.value.trim();if(!msg)return;
  inp.value='';inp.style.height='48px';
  chatHistory.push({role:'user',content:msg});
  const btn=document.getElementById('chat-send');btn.disabled=true;
  chatHistory.push({role:'assistant',content:'__thinking__'});
  renderChat();
  const sys=`You are a helpful household assistant for Cameron King in San Miguel de Allende, Mexico. He lives with wife Karen, daughter Sienna, dog Ella.\n\n${getListSummary()}\n\nHelp him add items, check status, suggest what to focus on, give SMA local tips. Be concise — short direct answers only.`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,system:sys,
        messages:chatHistory.filter(m=>m.content!=='__thinking__')})
    });
    const d=await r.json();
    const reply=d.content?.[0]?.text||'Error — try again.';
    chatHistory=chatHistory.filter(m=>m.content!=='__thinking__');
    chatHistory.push({role:'assistant',content:reply});
  }catch(e){
    chatHistory=chatHistory.filter(m=>m.content!=='__thinking__');
    chatHistory.push({role:'assistant',content:'Connection error.'});
  }
  btn.disabled=false;renderChat();
}
function renderChat(){
  const wrap=document.getElementById('chat-msgs');if(!wrap)return;
  wrap.innerHTML=chatHistory.map(m=>{
    if(m.role==='user')return`<div class="msg user">${esc(m.content)}</div>`;
    if(m.content==='__thinking__')return`<div class="msg ai"><div class="msg-name">Assistant</div><div class="thinking-dots"><span></span><span></span><span></span></div></div>`;
    return`<div class="msg ai"><div class="msg-name">Assistant</div>${esc(m.content).replace(/\n/g,'<br>')}</div>`;
  }).join('');
  wrap.scrollTop=wrap.scrollHeight;
}
function useChip(t){document.getElementById('chat-inp').value=t;sendChat();}
function aiHTML(){
  return`<div class="chat-wrap">
    <div class="suggestion-chips">
      <div class="chip" onclick="useChip('What should I focus on today?')">Today's focus</div>
      <div class="chip" onclick="useChip('What shopping is still needed?')">Shopping status</div>
      <div class="chip" onclick="useChip('What cleaning is due?')">Cleaning due?</div>
      <div class="chip" onclick="useChip('Am I forgetting anything?')">Forgetting anything?</div>
    </div>
    <div class="chat-messages" id="chat-msgs" style="min-height:200px;max-height:calc(100vh - 420px);"></div>
    <div class="chat-input-row">
      <textarea class="chat-input" id="chat-inp" placeholder="Ask anything..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
      <button class="chat-send" id="chat-send" onclick="sendChat()">↗</button>
    </div>
  </div>`;
}

/* ── RENDER ── */
function render(){
  const main=document.getElementById('main');
  if(currentTab==='lists')main.innerHTML=listsHTML();
  else if(currentTab==='cleaning')main.innerHTML=cleaningHTML();
  else if(currentTab==='ai'){main.innerHTML=aiHTML();renderChat();}
  else if(currentTab==='phrases')main.innerHTML=phrasesHTML();
  updateStats();
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ── INIT ── */
loadData();
</script>
